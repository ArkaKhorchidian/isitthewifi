[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "isitthewifi"
version = "0.1.0"
description = "Is it the Wi-Fi? Grades your connection A-F (latency under load, jitter, packet loss, DNS) and tells you in plain English whether the problem is your Wi-Fi, your router, your ISP, or DNS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arka Khorchidian" }]
requires-python = ">=3.9"
dependencies = ["rich>=13"]
keywords = ["wifi", "bufferbloat", "speedtest", "latency", "network", "jitter", "packet-loss", "dns", "router", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
isitthewifi = "isitthewifi.cli:main"

[project.urls]
Homepage = "https://github.com/ArkaKhorchidian/isitthewifi"
Issues = "https://github.com/ArkaKhorchidian/isitthewifi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/isitthewifi"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
